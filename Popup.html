<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#16161d; --panel:#20202a; --line:#2e2e3a; --text:#ececf1; --muted:#9a9aab; --accent:#f0b429; --changed:#4fd1a5; }
  * { box-sizing:border-box; }
  body { margin:0; width:380px; max-height:580px; background:var(--bg); color:var(--text); font:13px/1.35 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); padding:12px 12px 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  input[type=search] { width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  .note { color:var(--muted); font-size:11px; margin-top:6px; }
  .tier { margin:10px 12px 4px; font-weight:600; display:flex; justify-content:space-between; color:var(--accent); }
  .tier span { color:var(--muted); font-weight:400; }
  .row { display:grid; grid-template-columns:1fr 50px 22px; gap:2px 8px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); }
  .row.hidden { display:none; }
  .name { font-weight:500; }
  .row.changed .name { color:var(--changed); }
  .odds { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  .slider { grid-column:1 / 3; display:flex; gap:8px; align-items:center; }
  .slider input[type=range] { flex:1; accent-color:var(--accent); }
  .slider input[type=number] { width:52px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 4px; }
  .reset { grid-row:1 / 3; grid-column:3; padding:2px 4px; visibility:hidden; }
  .row.changed .reset { visibility:visible; }
  .row.blocked .name { color:var(--muted); text-decoration:line-through; }
  .toggle { display:flex; gap:6px; align-items:center; margin-top:8px; cursor:pointer; }
  .toggle input { accent-color:var(--accent); }
  .tier button { font-size:11px; padding:1px 6px; margin-left:6px; }
  .msg { padding:24px 16px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>Shop odds <span class="btns"><button id="allZero">All to 0</button> <button id="resetAll">Reset all</button></span></h1>
    <input id="search" type="search" placeholder="Search items…">
    <label class="toggle"><input type="checkbox" id="fill"> Only offer items I've turned on (spare slots become Poké Balls)</label>
    <div class="note">% = chance per shop slot with normal tier odds. With the box ticked, every slot picks from your turned-on items by weight instead, whatever the tier. Changes apply from the next shop or reroll.</div>
  </header>
  <main id="list"><div class="msg">Loading…</div></main>
  <script src="popup.js"></script>
</body>
</html>
